<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Paleta de Colores Gratis | ConfiguroWeb</title>
    <meta name="description" content="Crea paletas de colores aleatorias y armoniosas gratis. Copia codigos HEX, RGB y HSL para tus diseños.">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; } .mono { font-family: 'JetBrains Mono', monospace; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">
    <header class="border-b border-slate-800 sticky top-0 z-50 bg-slate-900/95 backdrop-blur">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <span class="text-xl font-bold text-fuchsia-500">Configuro<span class="text-slate-100">Web</span></span>
            <a href="https://configuroweb.com/tag/gratis" class="text-sm font-medium text-slate-400 hover:text-fuchsia-500">← Apps Gratuitas</a>
        </div>
    </header>
    <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="text-center mb-8">
            <h1 class="text-2xl md:text-3xl font-bold mb-2">Generador de Paleta de Colores</h1>
            <p class="text-slate-400 text-sm">Crea paletas de colores aleatorias y copia sus códigos fácilmente.</p>
        </div>

        <div class="flex justify-center gap-3 mb-8">
            <button onclick="generate()" class="bg-fuchsia-600 hover:bg-fuchsia-500 text-white font-semibold px-6 py-2.5 rounded-xl text-sm cursor-pointer">🎨 Generar Paleta</button>
            <button onclick="lockAll()" id="lockAllBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold px-6 py-2.5 rounded-xl text-sm cursor-pointer">🔒 Bloquear todo</button>
        </div>

        <div id="palette" class="grid grid-cols-2 md:grid-cols-5 gap-3 rounded-2xl overflow-hidden"></div>

        <p class="text-center text-xs text-slate-500 mt-6">💡 Presiona la <strong>barra espaciadora</strong> para generar una nueva paleta. Haz clic en 🔒 para mantener un color.</p>
    </main>
    <footer class="border-t border-slate-800 mt-12">
        <div class="max-w-5xl mx-auto px-4 py-6 text-center text-xs text-slate-500">&copy; 2026 ConfiguroWeb.</div>
    </footer>
    <script>
        const palette = [
            { color: '', locked: false },
            { color: '', locked: false },
            { color: '', locked: false },
            { color: '', locked: false },
            { color: '', locked: false }
        ];

        function randomColor() {
            const hue = Math.floor(Math.random() * 360);
            const sat = 60 + Math.floor(Math.random() * 30);
            const light = 45 + Math.floor(Math.random() * 25);
            return hslToHex(hue, sat, light);
        }

        function generate() {
            palette.forEach(p => { if (!p.locked) p.color = randomColor(); });
            render();
        }

        function render() {
            const container = document.getElementById('palette');
            container.innerHTML = palette.map((p, i) => {
                const textColor = isLight(p.color) ? 'text-slate-900' : 'text-white';
                const lockIcon = p.locked ? '🔒' : '🔓';
                const rgb = hexToRgb(p.color);
                return `
                    <div class="flex flex-col items-center justify-end pb-4 transition-colors" style="background-color:${p.color}; min-height: 300px;">
                        <button onclick="toggleLock(${i})" class="${textColor} text-2xl mb-3 cursor-pointer" title="Bloquear">${lockIcon}</button>
                        <button onclick="copyColor('${p.color}')" class="${textColor} mono font-semibold bg-black/20 px-3 py-1 rounded-lg cursor-pointer hover:bg-black/30 transition-colors">${p.color.toUpperCase()}</button>
                        <span class="${textColor} text-[10px] mt-1 opacity-80">rgb(${rgb.r}, ${rgb.g}, ${rgb.b})</span>
                    </div>
                `;
            }).join('');
        }

        function toggleLock(i) {
            palette[i].locked = !palette[i].locked;
            render();
        }

        function lockAll() {
            const allLocked = palette.every(p => p.locked);
            palette.forEach(p => p.locked = !allLocked);
            render();
        }

        function copyColor(hex) {
            navigator.clipboard.writeText(hex);
        }

        function hslToHex(h, s, l) {
            l /= 100; const a = s * Math.min(l, 1 - l) / 100;
            const f = n => { const k = (n + h / 30) % 12; const c = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1); return Math.round(255 * c).toString(16).padStart(2, '0'); };
            return `#${f(0)}${f(8)}${f(4)}`;
        }

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return { r, g, b };
        }

        function isLight(hex) {
            const { r, g, b } = hexToRgb(hex);
            return (r * 299 + g * 587 + b * 114) / 1000 > 155;
        }

        document.addEventListener('keydown', (e) => { if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); generate(); } });
        document.addEventListener('DOMContentLoaded', generate);
    </script>
</body>
</html>
